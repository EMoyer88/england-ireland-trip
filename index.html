<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erik Moyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0e1c16;
    --ink-2: #16281f;
    --paper: #f1ead9;
    --paper-dim: #cfc6ae;
    --gold: #c9a227;
    --gold-dim: #8a7530;
    --sage: #8fa396;
    --line: rgba(241,234,217,0.12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7vh 1.5rem;
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201,162,39,0.10), transparent 60%),
      radial-gradient(ellipse 800px 700px at 100% 100%, rgba(30,58,45,0.55), transparent 60%),
      var(--ink);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .frame {
    position: relative;
    max-width: 480px;
    width: 100%;
    padding: 3.2rem 2.6rem 2.6rem;
    background: linear-gradient(180deg, rgba(241,234,217,0.035), rgba(241,234,217,0.01));
    border: 1px solid rgba(201,162,39,0.18);
    border-radius: 2px;
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border: 1px solid var(--gold);
    opacity: 0.6;
  }
  .frame::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .frame::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .glyph {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.3em;
    margin: 0 0 20px;
  }
  .mark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(2.3rem, 7vw, 2.9rem);
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    background: linear-gradient(180deg, var(--paper) 40%, var(--paper-dim));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .rule {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 20px;
  }
  .rule .bar { width: 32px; height: 1px; background: var(--gold); opacity: 0.7; }
  .rule .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gold); }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage);
    margin: 0 0 38px;
  }
  .rows {
    display: flex;
    flex-direction: column;
  }
  .row {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 22px 6px;
    margin: 0 -6px;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: var(--paper);
    transition: padding-left 0.25s ease, background 0.25s ease;
  }
  .rows .row:last-child { border-bottom: 1px solid var(--line); }
  .row:hover {
    padding-left: 14px;
    background: linear-gradient(90deg, rgba(201,162,39,0.06), transparent 70%);
  }
  .row:hover .arrow { color: var(--gold); transform: translate(2px,-2px); }
  .row:hover .idx { color: var(--paper); }
  .idx {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--gold-dim);
    min-width: 18px;
    flex-shrink: 0;
    transition: color 0.25s ease;
  }
  .meta { flex: 1; }
  .name {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    margin: 0 0 4px;
  }
  .url {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--sage);
    margin: 0;
  }
  .arrow {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--paper-dim);
    font-size: 14px;
    flex-shrink: 0;
    transition: transform 0.25s ease, color 0.25s ease;
  }
  footer {
    margin-top: 36px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--sage);
    opacity: 0.55;
  }
  footer .bar { flex: 1; height: 1px; background: var(--line); }
</style>
</head>
<body>
<div class="frame">
  <p class="glyph">&#10022;</p>
  <p class="mark">Erik Moyer</p>
  <div class="rule"><span class="bar"></span><span class="dot"></span></div>
  <p class="tag">Personal projects &amp; tools</p>

  <div class="rows">
    <a class="row" href="https://movies.erikmoyer.me">
      <span class="idx">01</span>
      <span class="meta">
        <p class="name">Media</p>
        <p class="url">movies.erikmoyer.me</p>
      </span>
      <span class="arrow">&#8599;</span>
    </a>
    <a class="row" href="https://homeboyz.erikmoyer.me">
      <span class="idx">02</span>
      <span class="meta">
        <p class="name">Homeboyz Golf Pool</p>
        <p class="url">homeboyz.erikmoyer.me</p>
      </span>
      <span class="arrow">&#8599;</span>
    </a>
    <a class="row" href="https://psugolf.erikmoyer.me">
      <span class="idx">03</span>
      <span class="meta">
        <p class="name">PSU Golf Weekend</p>
        <p class="url">psugolf.erikmoyer.me</p>
      </span>
      <span class="arrow">&#8599;</span>
    </a>
  </div>

  <footer><span>erikmoyer.me</span><span class="bar"></span></footer>
</div>
</body>
</html>

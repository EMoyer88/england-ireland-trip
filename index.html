<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E2620">
<title>London, Dublin &amp; Belfast — October 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#0E2620; --hull:#143C31; --hull-2:#1A4A3D;
    --cream:#F2ECDC; --cream-dim:#CFC8B4;
    --gold:#C9A24B; --gold-dim:#8E7739;
    --steel:#7FA0A5; --rust:#A5623F;
    --line:rgba(242,236,220,0.14);
    --r:3px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
  html,body{overflow-anchor:none;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  body{margin:0;background:var(--ink);color:var(--cream);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:0 20px;}
  button{font:inherit;color:inherit;cursor:pointer;}
  a{color:var(--gold);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  .hidden{display:none !important;}

  /* ---------- Header ---------- */
  header.hero{
    padding:30px 0 16px;
    background:radial-gradient(1000px 320px at 50% -120px, rgba(201,162,75,0.09), transparent 60%), var(--ink);
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel);margin:0 0 10px;}
  h1.title{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,8vw,52px);line-height:1.02;margin:0 0 8px;letter-spacing:-.01em;}
  h1.title em{font-style:italic;color:var(--gold);}
  #tripline{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--gold);letter-spacing:.04em;margin:0;}
  .voyage{margin-top:18px;max-width:560px;}
  .voyage svg{width:100%;height:auto;display:block;}
  .v-rail{stroke:var(--line);stroke-width:1.5;fill:none;}
  .v-dash{stroke:var(--gold-dim);stroke-width:1.5;fill:none;stroke-dasharray:4 4;}
  .rivet{fill:var(--cream-dim);} .rivet.gold{fill:var(--gold);}
  .v-lab{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:var(--cream);letter-spacing:.06em;}
  .previewbar{background:var(--rust);color:var(--cream);font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:6px 20px;text-align:center;}

  /* ---------- Sticky tabs ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(14,38,32,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;padding-top:max(10px, env(safe-area-inset-top));}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:3px;}
  .tabs button{background:transparent;border:none;border-radius:var(--r);min-height:44px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-dim);}
  .tabs button.active{background:var(--gold);color:var(--ink);font-weight:500;}

  main{padding:0 0 110px;}

  /* ---------- Chips / tags ---------- */
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;border-radius:2px;border:1px solid var(--line);color:var(--cream-dim);white-space:nowrap;}
  .chip.soon{border-color:rgba(127,160,165,.55);color:var(--steel);}
  .chip.next{border-color:var(--gold);color:var(--gold);}
  .chip.live{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:500;}
  .chip.today{border-color:var(--gold);color:var(--gold);}
  .chip.done{color:#8b948f;border-color:rgba(242,236,220,.1);}
  .chip.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ink);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.7);}}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:2px;color:var(--cream-dim);border:1px solid var(--line);}
  .tag.booked{color:var(--gold);border-color:var(--gold-dim);}
  .tag.idea{border-style:dashed;color:var(--steel);border-color:rgba(127,160,165,.5);}
  .tag.open{border-style:dashed;}

  /* ---------- BLOCKS VIEW ---------- */
  .blocks{display:grid;gap:16px;padding:18px 0 0;}
  .block{
    position:relative;overflow:hidden;border:1px solid var(--line);border-radius:6px;
    min-height:420px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;
    padding:16px;isolation:isolate;
    transition:filter .3s, opacity .3s;
  }
  .b-photo{position:absolute;inset:0;z-index:-1;background:linear-gradient(155deg,var(--hull-2),var(--ink) 70%);}
  .b-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.8) contrast(1.06) brightness(.95);}
  .b-photo::before{content:'';position:absolute;inset:0;background:rgba(20,60,49,.38);mix-blend-mode:multiply;z-index:1;}
  .b-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,38,32,.55) 0%,rgba(14,38,32,.05) 32%,rgba(14,38,32,.55) 62%,rgba(14,38,32,.94) 100%);z-index:2;}
  .b-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold-dim);padding:5px 9px;border-radius:2px;background:rgba(14,38,32,.55);}
  .datebtn{background:rgba(14,38,32,.55);border:1px solid var(--line);border-radius:2px;min-height:44px;padding:0 12px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.04em;color:var(--cream);}
  .datebtn:hover{border-color:var(--gold-dim);}
  .b-top .chip{margin-left:auto;background:rgba(14,38,32,.55);}
  .b-top .chip.live,.b-top .chip.today.fill{background:var(--gold);}
  .b-main .city{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--cream-dim);margin-bottom:6px;}
  .b-main h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,8vw,40px);line-height:1.04;margin:0;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(0,0,0,.45);}
  .b-next{background:rgba(14,38,32,.8);border:1px solid rgba(242,236,220,.2);border-radius:4px;padding:12px 14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .b-next .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;}
  .b-next .what{font-family:'Fraunces',serif;font-weight:500;font-size:20px;line-height:1.2;margin:4px 0 2px;}
  .b-next .when{font-size:14px;color:var(--cream-dim);line-height:1.4;}
  .more{width:100%;margin-top:10px;min-height:46px;background:transparent;border:1px solid var(--gold);border-radius:3px;color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;}
  .more:hover{background:rgba(201,162,75,.12);}
  .block{scroll-margin-top:72px;}
  .block.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .block.past{filter:grayscale(1);opacity:.5;}
  .block.past .more{border-color:var(--line);color:var(--cream-dim);}

  /* ---------- ITINERARY VIEW ---------- */
  section.day{border-top:1px solid var(--line);padding:34px 0;scroll-margin-top:72px;}
  section.day:first-of-type{border-top:none;}
  .day-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  .day-date{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--steel);letter-spacing:.04em;}
  .day-head .chip{margin-left:auto;}
  h2.day-title{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(24px,6vw,34px);margin:8px 0 4px;letter-spacing:-.01em;}
  .day-loc{font-size:14px;color:var(--cream-dim);margin:0 0 18px;}
  section.day.past{opacity:.5;filter:grayscale(.85);}
  section.day.today{border-top-color:var(--gold-dim);}
  .stops{border-left:1px solid var(--line);padding-left:20px;margin-left:5px;}
  .stop{position:relative;padding:16px 0 16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start;scroll-margin-top:84px;}
  .stop:last-child{border-bottom:none;}
  .stop::before{content:'';position:absolute;left:-25px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--gold);}
  .stop.idea::before,.stop.open::before{background:transparent;border:1.5px solid var(--steel);}
  .stop.soon::before{box-shadow:0 0 0 3px rgba(127,160,165,.18);}
  .stop.done::before{background:#6c7771;border-color:#6c7771;}
  .stop.live{background:linear-gradient(90deg,rgba(201,162,75,.12),transparent 80%);margin-left:-8px;padding-left:8px;border-radius:3px;}
  .stop.live::before{left:-17px;box-shadow:0 0 0 4px rgba(201,162,75,.3);}
  .stop.done .stop-text,.stop.done .stop-photo{opacity:.5;}
  .stop-photo{width:76px;height:76px;object-fit:cover;border-radius:3px;flex-shrink:0;background:var(--hull);filter:saturate(.9);}
  .stop.done .stop-photo{filter:grayscale(1);}
  section.day.past .stop.done .stop-text,section.day.past .stop.done .stop-photo{opacity:1;}
  .stop-text{min-width:0;flex:1;}
  .stop-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .stop-time{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);letter-spacing:.04em;}
  .stop-name{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.2;margin:2px 0 4px;}
  .stop-note{font-size:14.5px;color:var(--cream-dim);line-height:1.5;max-width:580px;}
  .callout{margin-top:22px;border:1px solid var(--line);border-radius:3px;padding:18px 20px;background:rgba(242,236,220,.03);}
  .callout .lab{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);margin:0 0 8px;}
  .callout p{margin:0;font-size:15px;line-height:1.6;color:var(--cream-dim);max-width:620px;}
  .nowfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;min-height:48px;padding:0 18px;border-radius:24px;background:var(--gold);color:var(--ink);border:none;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.45);}

  /* ---------- MAP VIEW ---------- */
  #map-view{padding:16px 0 0;}
  .mapchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;}
  .mapchips button{flex:0 0 auto;min-height:44px;padding:0 12px;background:transparent;border:1px solid var(--line);border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--cream-dim);white-space:nowrap;}
  .mapchips button.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .mapchips button.past{opacity:.5;}
  #map-title{font-family:'Fraunces',serif;font-size:20px;margin:10px 0 2px;}
  #map-meta{font-size:13.5px;color:var(--cream-dim);min-height:20px;margin-bottom:10px;}
  #leaflet-map{width:100%;height:58vh;min-height:360px;border-radius:4px;border:1px solid var(--line);background:var(--hull);}
  .map-msg{padding:24px;color:var(--cream-dim);font-size:14px;}
  #map-list{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px;}
  #map-list li{display:flex;gap:12px;align-items:baseline;font-size:14.5px;color:var(--cream-dim);}
  #map-list .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);min-width:20px;}
  #map-list .tm{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);}
  .leaflet-popup-content-wrapper{background:var(--hull);color:var(--cream);border-radius:3px;}
  .leaflet-popup-tip{background:var(--hull);}
  .pop-photo{width:100%;height:100px;object-fit:cover;border-radius:2px;margin-bottom:6px;}
  .pop-name{font-family:'Fraunces',serif;font-size:16px;}
  .pop-time{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;}
  .pin{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:500 12px 'IBM Plex Mono',monospace;color:var(--ink);border:2px solid var(--ink);box-shadow:0 0 0 1px rgba(242,236,220,.4);}

  footer{border-top:1px solid var(--line);padding:30px 0 60px;}
  footer p{font-size:13.5px;color:var(--cream-dim);line-height:1.6;max-width:560px;margin:0 0 8px;}
  footer .foot-title{font-family:'Fraunces',serif;font-size:19px;color:var(--gold);}

  @media (min-width:700px){
    .blocks{grid-template-columns:1fr 1fr;}
    .block{min-height:460px;}
  }
</style>
</head>
<body>

<div id="previewbar" class="previewbar hidden"></div>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">Erik &amp; guest · Oct 8–17, 2026</p>
    <h1 class="title">London, Dublin,<br>and north to <em>Belfast</em>.</h1>
    <p id="tripline"></p>
    <div class="voyage" aria-hidden="true">
      <svg viewBox="0 0 880 110" preserveAspectRatio="xMidYMid meet">
        <path class="v-rail" d="M40,70 C 160,70 160,70 230,70 C 330,70 330,70 420,70 C 520,70 520,24 620,24 C 720,24 720,70 800,70 C 830,70 830,70 842,70"/>
        <path class="v-dash" d="M40,70 C 160,70 160,70 230,70 C 330,70 330,70 420,70 C 520,70 520,24 620,24 C 720,24 720,70 800,70 C 830,70 830,70 842,70"/>
        <circle class="rivet gold" cx="40" cy="70" r="5"/><text class="v-lab" x="40" y="94" text-anchor="middle">LONDON</text>
        <circle class="rivet gold" cx="420" cy="70" r="5"/><text class="v-lab" x="420" y="94" text-anchor="middle">DUBLIN</text>
        <circle class="rivet gold" cx="620" cy="24" r="5"/><text class="v-lab" x="620" y="14" text-anchor="middle">BELFAST</text>
        <circle class="rivet" cx="800" cy="70" r="4"/><text class="v-lab" x="800" y="94" text-anchor="middle">CAUSEWAY</text>
      </svg>
    </div>
  </div>
</header>

<div class="topbar">
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="Views">
      <button id="tab-blocks" role="tab" class="active" aria-selected="true">Days</button>
      <button id="tab-itinerary" role="tab" aria-selected="false">Itinerary</button>
      <button id="tab-map" role="tab" aria-selected="false">Map</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="blocks-view"><div class="blocks" id="blocks"></div></div>
  <div id="itinerary-view" class="hidden"><div id="itinerary"></div></div>
  <div id="map-view" class="hidden">
    <div class="mapchips" id="mapchips"></div>
    <h3 id="map-title"></h3>
    <div id="map-meta"></div>
    <div id="leaflet-map"></div>
    <ol id="map-list"></ol>
  </div>
</main>

<button id="nowfab" class="nowfab hidden" aria-label="Jump to what's happening now">Now ↓</button>

<footer class="wrap">
  <p class="foot-title">Built around one thing: the shipyard.</p>
  <p>Flight times marked with ~ come from public schedules, not your tickets. Check the airline apps. Items tagged IDEA are suggestions, not bookings.</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    var dd=Math.round(ms/86400000); return dd+(dd===1?' day':' days');
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var TAGTXT={booked:'Booked',plan:'Plan',idea:'Idea',open:'Open'};

  var params = new URLSearchParams(location.search);
  var override = params.get('now') ? new Date(params.get('now')) : null;
  function now(){ return override && !isNaN(override) ? override : new Date(); }

  days.forEach(function(day){
    day.start = new Date(STARTS[day.n]); day.end = new Date(STARTS[day.n+1]);
    day.off = day.off || EU;
    day.items.forEach(function(it){
      if(!it.tbd){ it.s = d(day.date,it.a,day.off); it.e = d(day.date,it.b,day.off); }
    });
  });

  function itemStatus(it, day, t){
    if(it.tbd){ if(t<day.start) return 'soon'; if(t<day.end) return 'today'; return 'done'; }
    if(t<it.s) return 'soon'; if(t<=it.e) return 'live'; return 'done';
  }
  function compute(t){
    var next=null;
    days.forEach(function(day){
      day.st = t>=day.end ? 'past' : (t>=day.start ? 'today' : 'future');
      day.items.forEach(function(it){ it.st = itemStatus(it,day,t); it.isNext=false; });
    });
    outer: for(var i=0;i<days.length;i++){ for(var j=0;j<days[i].items.length;j++){ var it=days[i].items[j]; if(it.st==='soon'||it.st==='today'){ it.isNext=true; next=it; break outer; } } }
    return next;
  }
  function chipFor(it){
    if(it.st==='live') return ['live','Happening now'];
    if(it.st==='done') return ['done','✓ Done'];
    if(it.isNext) return ['next','Up next'];
    if(it.st==='today') return ['today','Today'];
    return ['soon','Coming up'];
  }

  // ---------- build DOM ----------
  var blocksEl=document.getElementById('blocks'), itinEl=document.getElementById('itinerary');
  var blockRefs=[], dayRefs=[];

  function buildBlocks(){
    var html='';
    days.forEach(function(day){
      html += '<article class="block" id="block-'+day.n+'" data-n="'+day.n+'">'+
        '<div class="b-photo">'+(PH[day.hero]?'<img alt="" loading="lazy" src="'+esc(px(PH[day.hero],1000))+'">':'')+'</div>'+
        '<div class="b-top"><span class="pill">DAY '+day.n+'</span>'+
          '<button class="datebtn" data-go="'+day.n+'" aria-label="Open day '+day.n+' in the itinerary">'+day.dow+' · '+day.md+'</button>'+
          '<span class="chip" data-role="daychip"></span></div>'+
        '<div class="b-main"><div class="city">'+esc(day.city)+'</div><h2>'+esc(day.title)+'</h2></div>'+
        '<div><div class="b-next"><div class="lbl" data-role="lbl"></div><div class="what" data-role="what"></div><div class="when" data-role="when"></div></div>'+
        '<button class="more" data-go="'+day.n+'">See more →</button></div>'+
      '</article>';
    });
    blocksEl.innerHTML=html;
    days.forEach(function(day){
      var el=document.getElementById('block-'+day.n);
      blockRefs.push({el:el,chip:el.querySelector('[data-role=daychip]'),lbl:el.querySelector('[data-role=lbl]'),what:el.querySelector('[data-role=what]'),when:el.querySelector('[data-role=when]')});
    });
  }

  function buildItinerary(){
    var html='';
    days.forEach(function(day){
      html += '<section class="day" id="day-'+day.n+'"><div class="day-head"><span class="pill">DAY '+day.n+'</span><span class="day-date">'+day.dow+', '+day.md+'</span><span class="chip" data-role="daychip"></span></div>'+
        '<h2 class="day-title">'+esc(day.title)+'</h2><p class="day-loc">'+esc(day.where)+'</p><div class="stops">';
      day.items.forEach(function(it,idx){
        it.id='item-'+day.n+'-'+idx;
        html += '<div class="stop '+it.k+'" id="'+it.id+'">'+
          (it.ph&&PH[it.ph]?'<img class="stop-photo" alt="" loading="lazy" src="'+esc(px(PH[it.ph],300))+'">':'')+
          '<div class="stop-text"><div class="stop-meta"><span class="stop-time">'+esc(lab(it))+'</span><span class="chip" data-role="chip"></span><span class="tag '+it.k+'">'+TAGTXT[it.k]+'</span></div>'+
          '<div class="stop-name">'+esc(it.t)+'</div><div class="stop-note">'+esc(it.n)+'</div></div></div>';
      });
      html += '</div>';
      if(day.callout) html += '<div class="callout"><p class="lab">'+esc(day.callout.lab)+'</p><p>'+esc(day.callout.text)+'</p></div>';
      html += '</section>';
    });
    itinEl.innerHTML=html;
    days.forEach(function(day){
      var sec=document.getElementById('day-'+day.n);
      dayRefs.push({el:sec,chip:sec.querySelector('[data-role=daychip]')});
      day.items.forEach(function(it){ var e=document.getElementById(it.id); it.el=e; it.chipEl=e.querySelector('[data-role=chip]'); });
    });
  }

  // remove images that fail to load (gradient fallback shows through)
  document.addEventListener('error',function(e){ var t=e.target; if(t && t.tagName==='IMG'){ t.style.display='none'; } },true);

  // ---------- live update ----------
  function dayChipText(day,t){
    if(day.st==='past') return ['done','✓ Done'];
    if(day.st==='today') return day.items.some(function(i){return i.st==='live';}) ? ['live','Happening now'] : ['today','Today'];
    return ['soon','In '+rel(day.start-t)];
  }
  function upNext(day,t){
    if(day.st==='past') return {lbl:'Completed',what:'All done here',when:''};
    if(day.st==='today'){
      var live=day.items.filter(function(i){return i.st==='live';});
      var nx=day.items.filter(function(i){return i.st==='soon'||i.st==='today';})[0];
      if(live.length){ var it=live[0]; return {lbl:'Happening now',what:it.t,when:'Started '+lab(it)+(nx?' · then '+nx.t:'')}; }
      if(nx) return {lbl:'Up next',what:nx.t,when:(nx.tbd?'':'in '+rel(nx.s-t)+' · ')+lab(nx)};
      return {lbl:'Done for today',what:'Nothing else on the list',when:''};
    }
    var f=day.items[0]; return {lbl:'First up',what:f.t,when:lab(f)};
  }
  function update(){
    var t=now(); compute(t);
    var cur=null; days.forEach(function(day){ if(day.st==='today') cur=day; });
    var tl=document.getElementById('tripline');
    if(t<days[0].start) tl.textContent='Trip starts in '+rel(days[0].start-t);
    else if(!cur) tl.textContent='Trip complete. Welcome home.';
    else tl.textContent='Day '+cur.n+' of '+days.length+' · '+cur.city;

    days.forEach(function(day,i){
      var b=blockRefs[i], un=upNext(day,t), dc=dayChipText(day,t);
      b.el.className='block '+day.st;
      b.chip.className='chip '+dc[0]; b.chip.textContent=dc[1];
      b.lbl.textContent=un.lbl; b.what.textContent=un.what; b.when.textContent=un.when;
      b.when.style.display=un.when?'':'none';
      var r=dayRefs[i]; r.el.className='day '+day.st; r.chip.className='chip '+dc[0]; r.chip.textContent=dc[1];
      day.items.forEach(function(it){
        var c=chipFor(it);
        it.el.className='stop '+it.k+' '+(it.st==='live'?'live':it.st==='done'?'done':'soon');
        it.chipEl.className='chip '+c[0]; it.chipEl.textContent=c[1];
      });
    });
    var pb=document.getElementById('previewbar');
    if(override){ pb.textContent='Preview mode · pretending it is '+params.get('now'); pb.classList.remove('hidden'); } else pb.classList.add('hidden');
    refreshMapChips();
  }

  // ---------- navigation ----------
  var view='blocks';
  var views={blocks:document.getElementById('blocks-view'),itinerary:document.getElementById('itinerary-view'),map:document.getElementById('map-view')};
  var tabs={blocks:document.getElementById('tab-blocks'),itinerary:document.getElementById('tab-itinerary'),map:document.getElementById('tab-map')};
  var fab=document.getElementById('nowfab');
  function setView(v){
    view=v;
    Object.keys(views).forEach(function(k){ views[k].classList.toggle('hidden',k!==v); tabs[k].classList.toggle('active',k===v); tabs[k].setAttribute('aria-selected',k===v?'true':'false'); });
    fab.classList.toggle('hidden', v!=='itinerary');
    if(v==='map') showMap(mapDay || defaultMapDay());
  }
  function nowTarget(){
    var live=null, nx=null;
    days.forEach(function(day){ day.items.forEach(function(it){ if(!live && it.st==='live') live=it; if(!nx && it.isNext) nx=it; }); });
    return live||nx;
  }
  function scrollToEl(el, smooth, center){
    var off = 84; // clears the sticky tab bar
    function targetY(){
      var y = el.getBoundingClientRect().top + window.pageYOffset - (center ? Math.max(off, (window.innerHeight - el.offsetHeight)/2) : off);
      return Math.max(0,y);
    }
    function go(y, soft){
      var root=document.documentElement;
      if(soft){ window.scrollTo({top:y, behavior:'smooth'}); }
      else { root.style.scrollBehavior='auto'; window.scrollTo(0,y); root.style.scrollBehavior=''; }
    }
    go(targetY(), smooth);
    // fonts and photos can nudge the layout right after a jump, so re-check twice
    [300,1000].forEach(function(ms){ setTimeout(function(){ var y2=targetY(); if(Math.abs(y2-window.pageYOffset)>12) go(y2,false); },ms); });
  }
  function goDay(n){
    setView('itinerary');
    var day=days[n-1], target=document.getElementById('day-'+n);
    if(day.st==='today'){
      var it=day.items.filter(function(i){return i.st==='live';})[0] || day.items.filter(function(i){return i.isNext;})[0];
      if(it) target=it.el;
    }
    scrollToEl(target,false,false);
  }
  function jumpNow(){ var it=nowTarget(); if(it) scrollToEl(it.el,true,true); }
  function curDay(){ var c=null; days.forEach(function(x){ if(x.st==='today') c=x; }); return c; }
  tabs.blocks.addEventListener('click',function(){
    setView('blocks'); var c=curDay(); scrollToEl(c?document.getElementById('block-'+c.n):blocksEl,false,false);
  });
  tabs.itinerary.addEventListener('click',function(){
    setView('itinerary'); var it=curDay()?nowTarget():null; scrollToEl(it?it.el:document.getElementById('day-1'),false,false);
  });
  tabs.map.addEventListener('click',function(){ setView('map'); scrollToEl(mapChips,false,false); });
  fab.addEventListener('click',jumpNow);
  document.addEventListener('click',function(e){ var b=e.target.closest('[data-go]'); if(b) goDay(+b.getAttribute('data-go')); });

  // ---------- map ----------
  var map=null, group=null, mapDay=null, token=0;
  var CITYCOL={London:'#7FA0A5',Dublin:'#C9A24B','Northern Ireland':'#A5623F',Belfast:'#A5623F',Travel:'#CFC8B4','Heading home':'#C9A24B'};
  var mapChips=document.getElementById('mapchips');
  function defaultMapDay(){ var cur=null; days.forEach(function(x){ if(x.st==='today') cur=x; }); return cur?cur.n:2; }
  function refreshMapChips(){
    mapChips.innerHTML=''; days.forEach(function(day){
      var b=document.createElement('button'); b.textContent='D'+day.n+' · '+day.md;
      if(day.st==='past') b.classList.add('past'); if(mapDay===day.n) b.classList.add('active');
      b.addEventListener('click',function(){ showMap(day.n); }); mapChips.appendChild(b);
    });
  }
  function msg(t){ document.getElementById('leaflet-map').innerHTML='<div class="map-msg">'+esc(t)+'</div>'; }
  function showMap(n){
    mapDay=n; refreshMapChips();
    var day=days[n-1];
    document.getElementById('map-title').textContent='Day '+day.n+' · '+day.title;
    var meta=document.getElementById('map-meta'); meta.textContent='';
    var pts=[]; day.items.forEach(function(it){ if(it.loc){ var L0=LOC[it.loc]; if(!pts.length || pts[pts.length-1].key!==it.loc) pts.push({key:it.loc,it:it,loc:L0}); } });
    var list=document.getElementById('map-list'); list.innerHTML='';
    pts.forEach(function(p,i){ var li=document.createElement('li'); li.innerHTML='<span class="num">'+(i+1)+'</span><span><span class="tm">'+esc(lab(p.it))+'</span> &nbsp;'+esc(p.loc.n)+'</span>'; list.appendChild(li); });
    if(typeof L==='undefined'){ msg('The map needs an internet connection to load.'); return; }
    var host=document.getElementById('leaflet-map');
    if(!map){ host.innerHTML=''; map=L.map('leaflet-map',{scrollWheelZoom:false}).setView([53.9,-6.5],7);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap contributors &copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);
      group=L.layerGroup().addTo(map); }
    setTimeout(function(){ map.invalidateSize(); },60);
    group.clearLayers();
    if(!pts.length){ meta.textContent='No mapped stops for this day.'; return; }
    var col=CITYCOL[day.city]||'#C9A24B', bounds=[];
    pts.forEach(function(p,i){
      var icon=L.divIcon({className:'',html:'<div class="pin" style="background:'+col+'">'+(i+1)+'</div>',iconSize:[24,24],iconAnchor:[12,12]});
      var m=L.marker([p.loc.lat,p.loc.lng],{icon:icon}).addTo(group);
      m.bindPopup((p.it.ph&&PH[p.it.ph]?'<img class="pop-photo" src="'+esc(px(PH[p.it.ph],400))+'" alt="">':'')+'<div class="pop-time">'+esc(lab(p.it))+'</div><div class="pop-name">'+esc(p.loc.n)+'</div>',{maxWidth:220});
      bounds.push([p.loc.lat,p.loc.lng]);
    });
    map.fitBounds(bounds,{padding:[36,36],maxZoom:15});
    var rpts=[]; day.items.forEach(function(it){ if(it.loc && !it.noroute && (!rpts.length||rpts[rpts.length-1]!==it.loc)) rpts.push(it.loc); });
    if(day.route==='none' || rpts.length<2) return;
    var my=++token;
    var coords=rpts.map(function(k){return LOC[k].lng+','+LOC[k].lat;}).join(';');
    var base=day.route==='drive'?'https://router.project-osrm.org/route/v1/driving/':'https://routing.openstreetmap.de/routed-foot/route/v1/driving/';
    function straight(){ if(my!==token) return; L.polyline(rpts.map(function(k){return [LOC[k].lat,LOC[k].lng];}),{color:col,weight:3,dashArray:'6 8'}).addTo(group); meta.textContent='Dashed line = straight line (route lookup unavailable).'; }
    fetch(base+coords+'?overview=full&geometries=geojson').then(function(r){return r.json();}).then(function(j){
      if(my!==token) return;
      if(j.routes && j.routes[0]){
        var rt=j.routes[0]; var g=L.geoJSON(rt.geometry,{style:{color:col,weight:4,opacity:.9}}).addTo(group); map.fitBounds(g.getBounds(),{padding:[36,36]});
        var km=rt.distance/1000; meta.textContent = day.route==='drive' ? ('Driving about '+Math.round(km)+' km · '+rel(rt.duration*1000)) : ('Walking route · about '+km.toFixed(1)+' km total');
      } else straight();
    }).catch(straight);
  }

  // ---------- init ----------
  buildBlocks(); buildItinerary(); update();
  setInterval(update,30000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) update(); });
  var v=params.get('view'); if(v&&views[v]) setView(v);
  var cur=null; days.forEach(function(x){ if(x.st==='today') cur=x; });
  if(cur && view==='blocks') setTimeout(function(){ var b=document.getElementById('block-'+cur.n); if(b) scrollToEl(b,false,false); },50);
  window.__trip={days:days,update:update,setView:setView,showMap:showMap};
})();
</script>
</body>
